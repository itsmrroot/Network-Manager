[package]
name = "netmgr"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "Manage network adapters, IP and MAC addresses, Wi-Fi passwords and the devices on your network"
authors = ["Bashar Salmo"]
license = "MIT"
repository = "https://github.com/itsmrroot/Network-Manager"
readme = "README.md"
keywords = ["network", "ip-address", "mac-address", "wifi", "lan-scanner"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "netmgr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
netdev = "0.46.3"
qrcode = { version = "0.14.1", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serialport = { version = "4.10.1", default-features = false }
socket2 = { version = "0.6.5", features = ["all"] }
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"
portable-pty = "0.9.0"
similar = "3.2.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace]
members = ["gui"]
