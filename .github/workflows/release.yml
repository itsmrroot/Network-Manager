name: Release

# Started from main (Actions → Release → Run workflow, or
# `gh workflow run release.yml -f tag=v1.2.3`): runs on main share their
# caches — compiled libraries and packaging tools — so each release reuses
# the last one's. (Runs started by pushing a tag cannot use them.) The tag is
# created with the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.9.2 (must match Cargo.toml)"
        required: true
  push:
    tags: ["v*"]

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and macOS packages contain the desktop app and the command
          # line; `installer` adds a setup program / disk image next to them.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, packages: "-p netmgr -p netmgr-gui", bins: "netmgr.exe netmgr-gui.exe", installer: nsis, label: windows-x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, packages: "-p netmgr -p netmgr-gui", bins: "netmgr.exe netmgr-gui.exe", installer: nsis, label: windows-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, packages: "-p netmgr -p netmgr-gui", bins: "netmgr netmgr-gui", installer: dmg, label: macos-apple-silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, packages: "-p netmgr -p netmgr-gui", bins: "netmgr netmgr-gui", installer: dmg, label: macos-intel }
          # Linux: a fully static command line, plus the desktop app (which
          # loads the system's graphics libraries, so it is built for glibc).
          # Built on the oldest supported Ubuntu, because a glibc program only
          # runs on that glibc version or newer: built on 22.04 it runs on
          # Ubuntu 22.04+, Debian 12+, Fedora 36+, Mint 21+.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, packages: "-p netmgr", bins: "netmgr" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, packages: "-p netmgr", bins: "netmgr" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, packages: "-p netmgr -p netmgr-gui", bins: "netmgr-gui", suffix: "-desktop", installer: linux, label: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, packages: "-p netmgr -p netmgr-gui", bins: "netmgr-gui", suffix: "-desktop", installer: linux, label: linux-arm64 }
    steps:
      - uses: actions/checkout@v5
      - name: Version matches the tag
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [[ "v$version" == "$TAG" ]] || { echo "Cargo.toml says $version, the tag is $TAG"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      - name: Package
        shell: bash
        run: |
          name=netmgr-${TAG}-${{ matrix.target }}${{ matrix.suffix }}
          mkdir "$name"
          for b in ${{ matrix.bins }}; do cp "target/${{ matrix.target }}/release/$b" "$name/"; done
          cp README.md LICENSE "$name/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      # Published to the public repository (the code stays private): the
      # app's updater and the download links look there.
      # (Not when testing locally with act, which has no token.)
      - if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          repository: itsmrroot/Network-Manager-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.TAG }}
          target_commitish: main
          files: ${{ env.ASSET }}
      # And to this (private) repository, with notes from its history.
      - if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.ASSET }}
          generate_release_notes: true

      # Installers (configured in gui/Cargo.toml). They run after the archive is
      # published, so a failing installer never holds back the plain download.
      # Built from source (no ready-made downloads): kept between releases.
      - if: matrix.installer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager*
            ~/.cargo/bin/cargo-generate-rpm*
          key: tools-${{ runner.os }}-${{ runner.arch }}-packager-0.11.8-rpm-0.21.0
      - name: Install packaging tools
        if: matrix.installer
        shell: bash
        run: |
          command -v cargo-packager || cargo install --locked cargo-packager@0.11.8
          if [[ "${{ matrix.installer }}" == linux ]]; then
            command -v cargo-generate-rpm || cargo install --locked cargo-generate-rpm@0.21.0
          fi
      - name: Build installers
        if: matrix.installer
        shell: bash
        env:
          # linuxdeploy is itself an AppImage; this lets it run without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # No version in the name, so that the README can link to
          # releases/latest/download/<name> and always get the newest one.
          base=netmgr-${{ matrix.label }}
          # cargo-packager takes its output folder relative to gui/.
          pkg=gui/pkg
          pack="cargo packager --release --target ${{ matrix.target }} -p netmgr-gui -o pkg"
          mkdir installers
          case "${{ matrix.installer }}" in
            nsis)
              $pack -f nsis
              cp "$pkg"/*.exe "installers/$base-setup.exe" ;;
            dmg)
              # Binaries linked for Intel on an Apple Silicon runner carry no
              # signature at all, and the bundle cannot be signed around them.
              codesign --force -s - target/${{ matrix.target }}/release/netmgr target/${{ matrix.target }}/release/netmgr-gui
              $pack -f app,dmg
              # A bundle that fails this check opens as "damaged" after download.
              codesign --verify --deep --strict --verbose=2 "$pkg"/*.app
              cp "$pkg"/*.dmg "installers/$base.dmg" ;;
            linux)
              $pack -f deb,appimage
              cargo generate-rpm -p gui --target ${{ matrix.target }} -o "$GITHUB_WORKSPACE/$pkg"
              # Before 0.9.1 the package was wrongly called "network-manager",
              # the name of the system's NetworkManager: replace those. The
              # real NetworkManager is version 1.x, so it is never touched.
              deb=$(mktemp -d)
              dpkg-deb -R "$pkg"/*.deb "$deb"
              grep -q '^Package: netmgr$' "$deb/DEBIAN/control"
              printf 'Conflicts: network-manager (<< 0.9.1)\nReplaces: network-manager (<< 0.9.1)\n' >> "$deb/DEBIAN/control"
              dpkg-deb --root-owner-group -b "$deb" "installers/$base.deb"
              dpkg-deb -f "installers/$base.deb" Package Conflicts Replaces
              cp "$pkg"/*.AppImage "installers/$base.AppImage"
              cp "$pkg"/*.rpm "installers/$base.rpm" ;;
          esac
          ls -la installers
      - if: matrix.installer && !env.ACT
        uses: softprops/action-gh-release@v2
        with:
          repository: itsmrroot/Network-Manager-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.TAG }}
          target_commitish: main
          files: installers/*
      - if: matrix.installer && !env.ACT
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: installers/*
